# Checks KAS5H's SoundCloud once a day. When he has uploaded something new,
# the updated list is committed, and that push redeploys the site on Vercel.
# Runs only from the default branch (main).
name: Sync SoundCloud

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC, 11:47 in Delhi
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-soundcloud.mjs
      - name: Commit if his uploads changed
        run: |
          if git diff --quiet -- src/content/soundcloud.json; then
            echo "No new uploads."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/soundcloud.json
          git commit -m "Sync SoundCloud uploads"
          git push
